# Installs the staged Windows desktop installer on a clean runner: fresh install, the update from the 2.2.x app, and the
# self-update from the published 3.0.0 (run the way src/main.rs runs it).
name: desktop-windows-smoke
on:
  push:
    branches: [ci-desktop-smoke]
  workflow_dispatch:
env:
  BASE: https://cillhub.cillerian.org/download/desktop
  SETUP: Cillhub-Setup-3.0.1.exe
  VERSION: 3.0.1
  SHA512: 19f54e2bec4265b1e7d354ba8f37628416e4390aacb95b9cf235bc478e998229502d4d79e07b1512060d4e2666ce1876c342448d91b5fc3995a1877e0e9fdc12
  OLD_KEY: HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\59cd2796-830e-5e8c-88dd-c707d7eebc0a
defaults:
  run:
    shell: pwsh
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        mode: [fresh, migrate, update]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download and check the installer
        run: |
          Invoke-WebRequest "$env:BASE/staging/$env:SETUP" -OutFile setup.exe
          if ((Get-FileHash setup.exe -Algorithm SHA512).Hash.ToLower() -ne $env:SHA512) { throw 'sha512 mismatch' }
      - name: Install the 2.2.2 app first
        if: matrix.mode == 'migrate'
        run: |
          Invoke-WebRequest "$env:BASE/Cillhub-Setup-2.2.2.exe" -OutFile old.exe
          (Start-Process .\old.exe -ArgumentList '/S' -PassThru).WaitForExit()
          if (-not (Test-Path $env:OLD_KEY)) { throw '2.2.2 uninstall entry missing' }
      - name: Install the published 3.0.0 first
        if: matrix.mode == 'update'
        run: |
          Invoke-WebRequest "$env:BASE/Cillhub-Setup-3.0.0.exe" -OutFile old.exe
          (Start-Process .\old.exe -ArgumentList '/S' -PassThru).WaitForExit()
          Start-Process "$env:LOCALAPPDATA\Cillhub\cillhub.exe"
          Start-Sleep 10
      - name: Install (fresh), update the way the 2.2.x updater does (migrate) or the app does (update)
        run: |
          $installArgs = @{ fresh = '/S'; migrate = '--updated /S --force-run'; update = '/P /R' }['${{ matrix.mode }}']
          (Start-Process .\setup.exe -ArgumentList $installArgs -PassThru).WaitForExit()
          $exe = "$env:LOCALAPPDATA\Cillhub\cillhub.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          if ((Get-Item $exe).VersionInfo.ProductVersion -notlike "$env:VERSION*") { throw "installed version is not $env:VERSION" }
          if ('${{ matrix.mode }}' -eq 'fresh') { Start-Process $exe }
          Start-Sleep 30
          if ('${{ matrix.mode }}' -eq 'migrate') {
            if (Test-Path $env:OLD_KEY) { throw '2.2.2 uninstall entry still there' }
            if (Test-Path "$env:LOCALAPPDATA\Programs\Cillhub\Cillhub.exe") { throw '2.2.2 files still there' }
          }
          $p = Get-Process cillhub -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe }
          if (-not $p) { throw 'cillhub.exe is not running after 30 s' }
          $p | Format-Table Id, Path, MainWindowTitle
          if (-not ($p | Where-Object { $_.MainWindowTitle -like '*Cillhub*' })) { throw 'no window titled Cillhub' }
