<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="color-scheme" content="dark" />
<title>Cillhub – Offline</title>
<style>
  /* Arena tokens (dark); the fonts load when the browser still has them cached */
  @font-face { font-family: "Inter"; font-weight: 400; font-display: swap; src: url(/fonts/inter-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; font-display: swap; src: url(/fonts/inter-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2"); }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #17191e; color: #e3e6ec; font: 16px/1.4 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 72px; height: 72px; }
  h1 { color: #f7f8fa; font: 600 32px/34px "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .02em; text-transform: uppercase; margin: 16px 0 8px; }
  p { color: #9aa1ad; }
  button { margin-top: 16px; min-height: 36px; padding: 2px 16px; border: 0; border-radius: 2px; background: #ff6a1f; color: #170900; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: #ff8747; }
  button:focus-visible { outline: 2px solid #7cc4ff; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Cillhub can't reach the server. Check your connection and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>
