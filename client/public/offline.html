<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="color-scheme" content="dark" />
<title>Cillhub – Offline</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #111829; color: #e3e9f7; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 72px; height: 72px; }
  h1 { color: #f2f3f5; font-size: 22px; margin: 16px 0 8px; }
  button { margin-top: 16px; min-height: 38px; padding: 2px 16px; border: 0; border-radius: 6px; background: #22e1ff; color: #03141b; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Cillhub can't reach the server. Check your connection and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </main>
</body>
</html>
