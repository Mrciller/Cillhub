<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
<title>Share your screen</title>
<style>
  [hidden] { display: none !important; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #17191e; color: #e3e6ec; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header, footer { padding: 14px 18px; }
  header { border-bottom: 1px solid #2c3038; background: #121418; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.015em; color: #f7f8fa; }
  h2 { margin: 14px 18px 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #9aa1ad; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 0 18px; }
  .src { background: #1a1d23; border: 2px solid #2c3038; border-radius: 10px; padding: 8px; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .src img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #0e0f12; border-radius: 6px; display: block; }
  .src span { display: block; margin-top: 6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src[aria-pressed="true"] { border-color: #ff6a1f; background: #202329; }
  .src:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid #7cc4ff; outline-offset: 2px; }
  footer { display: flex; align-items: center; gap: 10px; background: #121418; border-top: 1px solid #2c3038; }
  label { margin-right: auto; display: flex; align-items: center; gap: 8px; font-weight: 600; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: #ff6a1f; }
  footer button { border: 1px solid transparent; border-radius: 8px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #cancel { background: #1f2228; border-color: #2c3038; color: #e3e6ec; }
  #share { background: #ff6a1f; color: #170900; font-weight: 700; }
  #share:disabled { opacity: .45; cursor: not-allowed; }
  main { flex: 1; overflow: auto; padding-bottom: 14px; }
</style>
</head>
<body>
  <header><h1>Choose what to share</h1></header>
  <main>
    <h2 id="h-screens">Screens</h2><div class="grid" id="screens" role="group" aria-labelledby="h-screens"></div>
    <h2 id="h-windows">Windows</h2><div class="grid" id="windows" role="group" aria-labelledby="h-windows"></div>
  </main>
  <footer>
    <label id="audio-wrap" hidden><input type="checkbox" id="audio"> Include system audio</label>
    <button id="cancel" type="button">Cancel</button>
    <button id="share" type="button" disabled>Share</button>
  </footer>
  <script src="picker.js"></script>
</body>
</html>
