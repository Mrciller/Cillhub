<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrims</title>
  <link rel="stylesheet" href="board.css">
  <script src="cillhub-panel.js" defer></script>
  <script src="board.js" defer></script>
</head>
<body>
  <main>
    <h1>Upcoming scrims</h1>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="list" aria-label="Upcoming scrims"></ul>

    <!-- Not a <form>: the panel sandbox has no allow-forms, so a submit would be blocked. -->
    <section id="add" aria-labelledby="add-title">
      <h2 id="add-title">Add a scrim</h2>
      <label for="opponent">Opponent</label>
      <input id="opponent" maxlength="60" autocomplete="off">
      <label for="at">Date and time</label>
      <input id="at" type="datetime-local">
      <label for="slots">Player slots</label>
      <input id="slots" type="number" min="1" max="20" value="5">
      <button id="add-button" type="button" class="primary">Add scrim</button>
    </section>
  </main>
</body>
</html>
