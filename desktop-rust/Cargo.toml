[package]
name = "cillhub-desktop"
version = "2.2.2"
edition = "2021"
authors = ["Pascal Oraze", "Cillhub Contributors"]
description = "Fast, lightweight native desktop client & audio DSP engine for Cillhub"
license = "AGPL-3.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
sysinfo = "0.33"
biquad = "0.4"
nnnoiseless = "0.5"
regex = "1.11"
url = "2.5"
percent-encoding = "2.3"
base64 = "0.22"
tauri = { version = "2.2", optional = true }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking", "json"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "blocking", "json"] }

[features]
default = []
gui = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2.2", optional = true }

[[bin]]
name = "cillhub-desktop"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"

[lib]
name = "cillhub_core"
path = "src/lib.rs"
