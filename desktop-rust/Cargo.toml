[package]
name = "cillhub"
version = "3.0.2"
edition = "2021"
authors = ["Pascal Oraze"]
description = "Cillhub pure-Rust native desktop client (egui/eframe, zero WebView/Tauri)"
license = "AGPL-3.0-only"

[dependencies]
cillhub-client-core = { path = "../rust-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[[bin]]
name = "cillhub"
path = "src/main.rs"

[lib]
name = "cillhub_core"
path = "src/lib.rs"
